<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CineMatch: encontre séries compatíveis com seus gêneros favoritos.">
    <meta property="og:title" content="CineMatchWeb">
    <meta property="og:description" content="Encontre séries compatíveis com seus gêneros favoritos.">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="cine-web.css">
    
    <title>CineWeb - Recomendações de Séries</title>
</head>

<body>
    <header>
    <div class="logo">
        <span class="logo-icone">🎬</span>
        <h1>CineWeb</h1>
    </div>
    <p><strong>Recomendações de séries sob medida pra você</strong></p>
</header>

    <main>
     <section id="populares">
        <h2>🔥 Mais procuradas</h2>
        <div id="lista-populares"></div>
     </section>

            
        <section id="perfil">
            <h2>Crie seu perfil</h2>
            <!-- Área que mostra o perfil já salvo (fica escondida até ter um perfil no localStorage) -->
<div id="perfil-salvo" hidden>
    <p id="texto-perfil-salvo"></p>
    <button id="btn-trocar-perfil" type="button">Trocar perfil</button>
</div>

            <form id="form-perfil">

                <label for="nome">nome</label>
                <input type="text" id="nome" name="nome" required>


                <label for="idade">idade</label>
                <input type="number" id="idade" name="idade" required>

                
    <fieldset>
    <legend><strong>Gêneros favoritos</strong></legend>

<label>
    <input type="checkbox" name="genero" value="Drama">
    🎭 Drama
</label>

<label>
    <input type="checkbox" name="genero" value="Comédia">
    😂 Comédia
</label>

<label>
    <input type="checkbox" name="genero" value="Ação">
    💥 Ação
</label>

<label>
    <input type="checkbox" name="genero" value="Thriller">
    😨 Thriller
</label>

<label>
    <input type="checkbox" name="genero" value="Terror">
    😱 Terror
</label>
</fieldset>
                
<button type="submit">Ver recomendações</button>

</form>
    <p id="mensagem-formulario" aria-live="polite"></p>
                                                                     <!--aria-live="polite": Esta é a parte mais importante para 
                                                                    a acessibilidade. O atributo aria-live avisa ao leitor de
                                                                     tela que esse parágrafo pode mudar de conteúdo dinamicamente.
                                                                      O valor "polite" (educado) diz ao leitor de tela que ele deve
                                                                       esperar o usuário parar de digitar ou ler o que está fazendo 
                                                                       antes de anunciar a nova mensagem que apareceu ali-->
        </section>

        <section id="resultados">
            <h2>Suas recomendações</h2>
            <div id="lista-cards"></div>

            <!-- Os cards das séries serão inseridos aqui pelo JavaScript -->

        </section>

        <footer>
            <p>&copy; 2026 CineWeb</p>
        </footer>

<!-- Modal com detalhes da série (fica escondido até um card ser clicado) -->
<div id="modal-serie" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="modal-conteudo">
        <button id="modal-fechar" class="modal-fechar" type="button" aria-label="Fechar detalhes da série">✕</button>
        <img id="modal-imagem" src="" alt="">
        <div class="modal-corpo">
            <h3 id="modal-titulo"></h3>
            <p id="modal-avaliacao"></p>
            <p id="modal-generos"></p>
            <p id="modal-sinopse"></p>
            
            <!-- 👇 ADICIONE ESTA LINHA 👇 -->
            <small id="modal-aviso" class="modal-aviso" hidden>
                📌 Sinopse original fornecida pela TVMaze (em inglês)
            </small>
            <!-- 👆 FIM DO AVISO 👆 -->
        </div>
    </div>
</div>
    </main>
  <script type="module" src="cine-web.js"></script>

  
</body>
</html>
